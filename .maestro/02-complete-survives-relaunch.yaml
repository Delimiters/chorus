# Tick a chore, kill the app, and find it still ticked.
#
# The completion is optimistic — patched into the cache before the server
# answers — so "it looked done" and "it *is* done" are genuinely different
# claims, and only a relaunch tells them apart.
appId: com.delimiters.chorus
name: A completion survives a relaunch
---
- launchApp
- assertVisible: 'Today'

# The chore flow 01 created, by name. Tapping "whatever is first" would depend
# on ordering and on which other chores exist, and would tick something else if
# either changed.
- tapOn: 'Mark Take out the bins done'
- assertVisible: 'Done'

- stopApp
- launchApp

# Still done after a cold start, which is the whole assertion.
- assertVisible: 'Done'
- assertVisible: 'Mark Take out the bins not done'

# Put it back, so the next flow starts from the state it expects. Flows share a
# device and an account; leaving this ticked would break flow 03.
- tapOn: 'Mark Take out the bins not done'
