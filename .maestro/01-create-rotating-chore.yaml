# Build a chore due today and confirm the preview agrees with the rule.
#
# **Daily**, deliberately. An earlier version made a Monday/Thursday chore,
# which meant the two flows after this one had nothing to act on five nights a
# week — they would have failed on a cron schedule and read as product bugs.
# Rotation is still exercised; the cadence just has to guarantee something is
# due today.
appId: com.delimiters.chorus
name: Create a recurring rotating chore
---
- launchApp
- tapOn: 'Chores'
- scrollUntilVisible:
    element: 'Add a chore'
    direction: DOWN
- tapOn: 'Add a chore'

- tapOn: 'Name'
- inputText: 'Take out the bins'
- tapOn: 'Daily'

# The rule in words. Asserted exactly, not as a wildcard: `every.*` would match
# any weekly or daily rule at all, which is the kind of assertion that passes
# while the chore is wrong.
- assertVisible: 'Repeats every day.'

- scrollUntilVisible:
    element: 'Take turns'
    direction: DOWN
- tapOn: 'Take turns'
- assertVisible: 'In this order'

- scrollUntilVisible:
    element: 'Add chore'
    direction: DOWN
- tapOn: 'Add chore'

- assertVisible: 'Take out the bins'
- assertVisible: 'Every day'
