name: Database

# CI is the source of truth for database tests. ubuntu-latest has Docker
# natively, so the Supabase stack starts fast and free here — a Colima hiccup on
# the dev machine must never block progress. See docs/TESTING.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: db-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Migrations, policies & integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Needed to diff against the base commit below.
          fetch-depth: 0

      # This job is a REQUIRED status check, so it has to report on every pull
      # request — including one that only touches a doc. A `paths:` filter on the
      # trigger cannot do that: a filtered-out workflow never runs, never
      # reports, and the pull request stays "Expected — waiting for status"
      # forever. That is not hypothetical; it blocked a one-line ROADMAP change.
      #
      # So the trigger is unconditional and the *work* is conditional. An
      # irrelevant change costs about ten seconds instead of four minutes.
      - name: Decide whether the database matters here
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base='${{ github.event.pull_request.base.sha }}'
          [ -n "$base" ] || base="${{ github.event.before }}"
          # A first push to a branch has no usable base; run everything rather
          # than guess.
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # engine-over-db.test.ts exists to catch drift between src/core and the
          # database, so a change to either has to run it.
          if git diff --name-only "$base" HEAD | grep -qE '^(supabase/|test/integration/|src/core/|src/data/|\.github/workflows/db\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No database-relevant changes; skipping the stack." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-node@v6
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
        if: steps.scope.outputs.run == 'true'

      # Pinned, because one step below diffs this CLI's *generated output*
      # against a file committed to the repo. At `latest` that check fails the
      # moment the CLI changes its code generator, on a branch that touched
      # nothing to do with it — which is exactly what happened on 2026-09-07,
      # when a newer CLI started emitting an extra pair of parentheses in the
      # `TableName extends (...)` boilerplate and a policy-only migration went
      # red for it.
      #
      # Bump this deliberately, and regenerate `src/data/database.types.ts` in
      # the same commit.
      - uses: supabase/setup-cli@v1
        if: steps.scope.outputs.run == 'true'
        with:
          version: 2.110.0

      - name: Start Supabase
        if: steps.scope.outputs.run == 'true'
        # Excluding what the policy tests don't need keeps startup down. Realtime
        # is deliberately included: Phase 7 will add subscription authorization
        # tests, and the publication is created by the migration.
        run: supabase start -x imgproxy,studio,logflare,vector,supavisor,mailpit

      # Proves the migrations apply to an empty database from scratch, which is
      # the only thing that guarantees a new environment can be stood up. It also
      # applies seed.sql, which the engine-over-db suite reads.
      - name: Reset from scratch
        if: steps.scope.outputs.run == 'true'
        run: supabase db reset

      # `supabase test db` exits 0 when it runs nothing at all. Measured, not
      # assumed: moving `supabase/tests` aside gives `Files=0, Tests=0`,
      # `Result: NOTESTS`, and `$? == 0`. So a bad path or a moved directory
      # would take the whole policy suite out of CI while this job stayed
      # green — the one failure mode a
      # policy suite cannot afford, because nothing else here checks RLS.
      #
      # The count is `*.sql`, which is what the runner itself globs — measured
      # by renaming `flags.test.sql` to `flags.sql`, which still ran. So the
      # guard compares like with like and fails when a file present on disk
      # goes unrun: a connection that dies mid-suite, a directory moved, a
      # path that stops resolving.
      #
      # What it deliberately does not claim to catch is a file *deleted*, since
      # both sides then drop together. That one is visible in the diff; a suite
      # silently shrinking to nothing in CI is not.
      - name: Policy tests (pgTAP)
        if: steps.scope.outputs.run == 'true'
        run: |
          set -o pipefail
          # `|| true` is load-bearing, and `2>/dev/null` alone was not enough.
          # Under Actions' `bash -e` plus `pipefail`, a glob that matches
          # nothing makes `ls` fail, which fails the pipeline, which kills the
          # step on the assignment itself — silently, before the branch below
          # can say what went wrong. Measured: without `|| true` the missing-
          # directory case exits 1 having printed nothing at all on either
          # stream. It failed closed, but "the directory moved" is precisely
          # the case this message exists for.
          EXPECTED="$(ls -1 supabase/tests/*.sql 2>/dev/null | wc -l | tr -d ' ' || true)"
          if [ "$EXPECTED" -eq 0 ]; then
            echo "::error::No .sql test files found in supabase/tests/."
            exit 1
          fi
          supabase test db 2>&1 | tee /tmp/pgtap.log
          if ! grep -q "^Result: PASS" /tmp/pgtap.log; then
            echo "::error::pgTAP did not report a pass."
            exit 1
          fi
          RAN="$(sed -n 's/^Files=\([0-9]*\),.*/\1/p' /tmp/pgtap.log | tail -1)"
          if [ "$RAN" != "$EXPECTED" ]; then
            echo "::error::pgTAP ran $RAN of the $EXPECTED .sql files in supabase/tests/. A file it skipped is a test that is not running."
            exit 1
          fi
          echo "pgTAP ran all $EXPECTED test files."

      - name: Integration tests
        if: steps.scope.outputs.run == 'true'
        run: npm run test:integration -- --ci --runInBand

      # If the live schema and the migration files disagree, someone changed the
      # database out of band. An empty diff is the only acceptable answer.
      - name: Schema drift guard
        if: steps.scope.outputs.run == 'true'
        run: |
          DIFF="$(supabase db diff --schema public)"
          if [ -n "$DIFF" ]; then
            echo "::error::The database does not match the migrations. Diff:"
            echo "$DIFF"
            exit 1
          fi
          echo "No drift: the schema matches the migrations."

      # Generated types are committed so the app can typecheck without a running
      # database. This fails if someone changed the schema and forgot to
      # regenerate them.
      - name: Generated types are current
        if: steps.scope.outputs.run == 'true'
        run: |
          supabase gen types typescript --local --schema public > /tmp/database.types.ts
          if ! diff -q /tmp/database.types.ts src/data/database.types.ts; then
            echo "::error::src/data/database.types.ts is stale. Regenerate with:"
            echo "  supabase gen types typescript --local --schema public > src/data/database.types.ts"
            diff /tmp/database.types.ts src/data/database.types.ts || true
            exit 1
          fi
          echo "Generated types match the schema."

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup || true
