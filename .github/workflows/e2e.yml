name: End-to-end

# Nightly and on demand — never on pull requests, because macOS runners bill at
# ten times the Linux rate and this job boots a simulator. A per-PR trigger
# would dominate the entire CI cost of the project.
#
# (An earlier version of this comment also blamed the 15-builds-a-month EAS free
# tier. That is wrong for this workflow: `--local` builds on the runner and
# consumes no EAS credits. The macOS cost argument stands on its own.)
#
# What this catches that nothing else can: the app actually launching, the
# navigator wiring up, and a completion surviving a real relaunch.
#
# ⚠️ Never run. It needs secrets that do not exist yet; see docs/RELEASE.md.
# Expect the first run to need fixing.
#
# The nightly schedule is deliberately commented out rather than deleted. With
# EXPO_TOKEN, SUPABASE_URL, and SUPABASE_KEY unset, every nightly run failed at
# the guard below — a red result that carried no information, arriving daily.
# A check that cannot pass is not a signal, and one that fails on a timer trains
# you to ignore the notification that eventually matters. Restore the schedule
# in the same commit that adds the secrets.
on:
  # schedule:
  #   # 07:00 UTC, so a failure is waiting rather than interrupting.
  #   - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      rebuild:
        description: 'Force a fresh build even if the cache is warm'
        type: boolean
        default: false

concurrency:
  group: e2e
  cancel-in-progress: true

jobs:
  e2e:
    name: Maestro flows
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      # Checked first, and outside the build step. It used to live inside, which
      # meant a warm cache skipped the guard entirely and the job failed later
      # and less clearly.
      - name: Required configuration
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          missing=0
          for name in EXPO_TOKEN SUPABASE_URL SUPABASE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set. See docs/RELEASE.md."
              missing=1
            fi
          done
          exit $missing

      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # Keyed on what can change the native binary. A JavaScript change is
      # delivered by the bundle at launch and must NOT bust this — that is what
      # keeps rebuilds rare.
      - name: Native fingerprint
        id: fingerprint
        run: echo "hash=$(cat package.json app.json | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore the simulator build
        id: cache
        uses: actions/cache@v4
        with:
          path: build/
          key: ios-sim-${{ steps.fingerprint.outputs.hash }}

      - name: Build for the simulator
        if: steps.cache.outputs.cache-hit != 'true' || inputs.rebuild
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # `EXPO_PUBLIC_*` are inlined at BUILD time — see src/data/env.ts. They
          # were on the test step in the first version of this file, which does
          # nothing to an already-compiled binary: the app would have thrown
          # "Missing EXPO_PUBLIC_SUPABASE_URL" on import, before React renders,
          # so even the error boundary could not have caught it.
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          mkdir -p build
          # A simulator build is delivered as a tarball, not a .app directory —
          # naming the output Chorus.app produces a tar.gz that simctl refuses.
          npx eas-cli@16 build --platform ios --profile simulator --local \
            --non-interactive --output build/Chorus.tar.gz
          tar -xzf build/Chorus.tar.gz -C build

      # Pick whatever iPhone the current runner image actually has. Hard-coding
      # a device name against a rolling image is how a nightly job dies quietly
      # six months later.
      - name: Boot a simulator
        run: |
          DEVICE="$(xcrun simctl list devices available --json \
            | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{
                const j=JSON.parse(d);
                const all=Object.values(j.devices).flat().filter(x=>x.name.startsWith('iPhone'));
                if(!all.length){console.error('no iPhone simulator available');process.exit(1)}
                console.log(all[all.length-1].udid);
              })")"
          echo "Booting $DEVICE"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b

      - name: Install the app
        run: xcrun simctl install booted "$(find build -maxdepth 2 -name '*.app' | head -1)"

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run the flows
        run: maestro test .maestro --format junit --output maestro-report.xml

      # A failure here happens overnight, and "assertion failed" without a
      # screenshot is most of a day's guessing. `$HOME` expanded explicitly:
      # upload-artifact globs do not expand `~`.
      - name: Keep the evidence
        if: always()
        run: |
          mkdir -p artifacts
          cp maestro-report.xml artifacts/ 2>/dev/null || true
          cp -R "$HOME/.maestro/tests" artifacts/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maestro-results
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
